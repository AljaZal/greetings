<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekend Message</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(270deg, #89f7fe, #66a6ff);
        background-size: 400% 400%;
        animation: gradientMove 10s ease infinite;
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
        overflow: hidden;
    }

    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .card {
        animation: fadeIn 2s ease forwards;
        z-index: 2;
    }

    h1 {
        font-size: 2.5rem;
        margin-bottom: 20px;
        animation: float 3s ease-in-out infinite;
    }

    p {
        font-size: 1.3rem;
        margin: 10px 0;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
        0% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0); }
    }

    /* Floating hearts */
    .heart-float {
        position: absolute;
        bottom: -20px;
        font-size: 20px;
        animation: rise 6s linear infinite;
        opacity: 0.7;
    }

    @keyframes rise {
        0% {
            transform: translateY(0) scale(1);
            opacity: 0.7;
        }
        100% {
            transform: translateY(-110vh) scale(1.5);
            opacity: 0;
        }
    }

    /* Moving dog */
    .dog {
        position: absolute;
        bottom: 20px;
        left: -100px;
        font-size: 3rem;
        animation: walk 12s linear infinite;
    }

    @keyframes walk {
        0% { left: -100px; }
        100% { left: 110%; }
    }

    /* Bottom center icons */
    .bottom {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
        font-size: 2.5rem;
        z-index: 2;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }

    .heart {
        color: red;
        margin-right: 10px;
    }
</style>
</head>

<body>

<div class="card">
    <h1>Dear Team</h1>
    <p>Wishing you a wonderful weekend</p>
    <p>Take time to recharge your energy ⚡</p>
    <p>for new challenges ahead! 💪</p>
</div>

<div class="bottom">
    <span class="heart">❤️</span> 🐶
</div>

<div class="dog">🐕</div>

<!-- Floating hearts (random positions via inline style) -->
<div class="heart-float" style="left:10%;">❤️</div>
<div class="heart-float" style="left:25%; animation-delay:2s;">❤️</div>
<div class="heart-float" style="left:40%; animation-delay:4s;">❤️</div>
<div class="heart-float" style="left:60%; animation-delay:1s;">❤️</div>
<div class="heart-float" style="left:75%; animation-delay:3s;">❤️</div>
<div class="heart-float" style="left:90%; animation-delay:5s;">❤️</div>

</body>
</html>
